name: Build Offline APK and AAB

on:[workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize React Native Expo Wrapper
        run: |
          npx --yes create-expo-app@latest wrapper-app --template blank --no-install
          cd wrapper-app
          npm install
          npx expo install react-native-webview

      - name: Copy Icon and Configure Android Metadata
        run: |
          mkdir -p wrapper-app/assets
          if [ -f "icon.png" ]; then
            cp icon.png wrapper-app/assets/icon.png
            cp icon.png wrapper-app/assets/adaptive-icon.png
          fi
          cd wrapper-app
          cat << 'EOF' > app.json
          {
            "expo": {
              "name": "Golden Tide Ocean Blitz",
              "slug": "golden-tide",
              "version": "1.0.1",
              "orientation": "portrait",
              "icon": "./assets/icon.png",
              "android": {
                "package": "com.maker.goldentideocean",
                "versionCode": 2,
                "adaptiveIcon": {
                  "foregroundImage": "./assets/adaptive-icon.png",
                  "backgroundColor": "#020915"
                }
              }
            }
          }
          EOF

      - name: Inject Offline App.js
        run: |
          cd wrapper-app
          cat << 'EOF' > App.js
          import React, { useRef, useEffect } from 'react';
          import { StatusBar, BackHandler, StyleSheet, View } from 'react-native';
          import { WebView } from 'react-native-webview';

          export default function App() {
            const webViewRef = useRef(null);

            useEffect(() => {
              const onBackPress = () => true; 
              BackHandler.addEventListener('hardwareBackPress', onBackPress);
              return () => BackHandler.removeEventListener('hardwareBackPress', onBackPress);
            }, []);

            return (
              <View style={styles.container}>
                <StatusBar hidden={true} />
                <WebView
                  ref={webViewRef}
                  source={{ uri: 'file:///android_asset/www/index.html' }}
                  originWhitelist={['*']}
                  allowFileAccess={true}
                  allowFileAccessFromFileURLs={true}
                  allowUniversalAccessFromFileURLs={true}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  mediaPlaybackRequiresUserAction={false}
                  bounces={false}
                  scrollEnabled={false}
                  showsHorizontalScrollIndicator={false}
                  showsVerticalScrollIndicator={false}
                  overScrollMode="never"
                  style={styles.webview}
                />
              </View>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: '#000000' },
            webview: { flex: 1, backgroundColor: 'transparent' },
          });
          EOF

      - name: Prebuild Native Android Project
        run: |
          cd wrapper-app
          npx expo prebuild --platform android --clean --no-install

      - name: Inject Native Offline Assets
        run: |
          mkdir -p wrapper-app/android/app/src/main/assets/www
          if [ -f "index.html" ]; then cp index.html wrapper-app/android/app/src/main/assets/www/; fi
          if [ -f "style.css" ]; then cp style.css wrapper-app/android/app/src/main/assets/www/; fi
          if [ -f "script.js" ]; then cp script.js wrapper-app/android/app/src/main/assets/www/; fi
          if [ -d "assets" ]; then cp -r assets wrapper-app/android/app/src/main/assets/www/; fi
          if [ -d "images" ]; then cp -r images wrapper-app/android/app/src/main/assets/www/; fi
          if [ -d "audio" ]; then cp -r audio wrapper-app/android/app/src/main/assets/www/; fi

      - name: Build Testing APK
        run: |
          cd wrapper-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Production AAB
        run: |
          cd wrapper-app/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Sign Production AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: wrapper-app/android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenTide-APK
          path: wrapper-app/android/app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: GoldenTide-Signed-AAB
          path: ${{steps.sign_app.outputs.signedReleaseFile}}


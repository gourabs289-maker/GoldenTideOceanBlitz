name: Build Offline APK and AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize React Native Expo Wrapper
        run: |
          npx --yes create-expo-app@latest wrapper-app --template blank --no-install
          cd wrapper-app
          npm install
          npx expo install react-native-webview

      - name: Prepare Local Web Assets
        run: |
          mkdir -p wrapper-app/assets/www
          cp index.html wrapper-app/assets/www/
          cp style.css wrapper-app/assets/www/
          cp script.js wrapper-app/assets/www/

      - name: Configure Metro Bundler
        run: |
          cd wrapper-app
          cat << 'EOF' > metro.config.js
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          config.resolver.assetExts.push('html', 'css', 'js');
          module.exports = config;
          EOF

      - name: Copy Icon and Configure Android Metadata
        run: |
          mkdir -p wrapper-app/assets
          if [ -f "icon.png" ]; then
            cp icon.png wrapper-app/assets/icon.png
            cp icon.png wrapper-app/assets/adaptive-icon.png
          fi
          cd wrapper-app
          cat << 'EOF' > app.json
          {
            "expo": {
              "name": "Golden Tide Ocean Blitz",
              "slug": "golden-tide",
              "version": "1.0.0",
              "orientation": "portrait",
              "icon": "./assets/icon.png",
              "android": {
                "package": "com.maker.goldentide",
                "versionCode": 1,
                "adaptiveIcon": {
                  "foregroundImage": "./assets/adaptive-icon.png",
                  "backgroundColor": "#020915"
                }
              }
            }
          }
          EOF

      - name: Inject Offline App.js
        run: |
          cd wrapper-app
          cat << 'EOF' > App.js
          import React, { useRef, useEffect } from 'react';
          import { StatusBar, BackHandler, StyleSheet, View } from 'react-native';
          import { WebView } from 'react-native-webview';

          export default function App() {
            const webViewRef = useRef(null);

            useEffect(() => {
              const onBackPress = () => true; 
              BackHandler.addEventListener('hardwareBackPress', onBackPress);
              return () => BackHandler.removeEventListener('hardwareBackPress', onBackPress);
            }, []);

            return (
              <View style={styles.container}>
                <StatusBar hidden={true} />
                <WebView
                  ref={webViewRef}
                  source={require('./assets/www/index.html')}
                  originWhitelist={['*']}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  mediaPlaybackRequiresUserAction={false}
                  bounces={false}
                  scrollEnabled={false}
                  showsHorizontalScrollIndicator={false}
                  showsVerticalScrollIndicator={false}
                  overScrollMode="never"
                  style={styles.webview}
                />
              </View>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: '#000000' },
            webview: { flex: 1, backgroundColor: 'transparent' },
          });
          EOF

      - name: Prebuild Native Android Project
        run: |
          cd wrapper-app
          npx expo prebuild --platform android --clean --no-install

      - name: Build Testing APK
        run: |
          cd wrapper-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Production AAB
        run: |
          cd wrapper-app/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenTide-APK
          path: wrapper-app/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: GoldenTide-AAB
          path: wrapper-app/android/app/build/outputs/bundle/release/*.aab


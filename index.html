<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Elite V1 Level 3</title>
    <link rel="stylesheet" href="./style.css">
    
    <!-- GAMEMONETIZE SDK SETUP -->
    <script type="text/javascript">
       window.SDK_OPTIONS = {
          gameId: "ig2yazeq5u6sr534p7xgan2j8bwq4p9l",
          onEvent: function (a) {
             switch (a.name) {
                case "SDK_GAME_PAUSE":
                   // MANDATORY: Pause and Mute
                   pauseOceanBlitz();
                   break;
                case "SDK_GAME_START":
                   // MANDATORY: Resume and Unmute
                   resumeOceanBlitz();
                   break;
                case "SDK_READY":
                   console.log("GameMonetize SDK Ready");
                   break;
             }
          }
       };

       (function (a, b, c) {
          var d = a.getElementsByTagName(b)[0];
          if (!a.getElementById(c)) {
             var s = a.createElement(b); s.id = c;
             s.src = "https://api.gamemonetize.com/sdk.js";
             d.parentNode.insertBefore(s, d);
          }
       })(document, "script", "gamemonetize-sdk");

       // GLOBAL CONTROL FOR YOUR script.js
       window.isAdPlaying = false;

       function pauseOceanBlitz() {
           window.isAdPlaying = true;
           const bgMusic = document.getElementById('bg-music');
           if (bgMusic) bgMusic.pause(); // Stop the ocean music
           console.log("Mission Paused for Ad");
       }

       function resumeOceanBlitz() {
           window.isAdPlaying = false;
           const bgMusic = document.getElementById('bg-music');
           // Only resume music if sound was already ON in your game settings
           if (bgMusic && window.isSoundOn) bgMusic.play(); 
           console.log("Mission Resumed");
       }

       // Function to trigger the ad
       function showOceanAd(callback) {
           if (typeof sdk !== 'undefined' && sdk.showBanner !== 'undefined') {
               sdk.showBanner();
           } else {
               if (callback) callback();
           }
       }
    </script>
</head>

<body>
    <div id="app">
        <audio id="bg-music" loop preload="auto">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
        </audio>

        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <!-- HUD and screens remain the same -->
            <div id="hud" class="hidden">
                <div class="hud-left">
                    <div class="hud-pill" id="hud-level">Level 1</div>
                    <div class="hud-pill" id="hud-distance">0m / 12,000m</div>
                    <div class="hud-pill" id="hud-biome">Blue Open Sea</div>
                </div>
                <div class="hud-center">
                    <div class="hud-big" id="hud-lives">Lifelines: 3</div>
                    <div class="hud-big gold" id="hud-score">Score: 0 / 10</div>
                    <div class="hud-small" id="hud-combo">Combo: x1</div>
                    <div class="hud-small cyan" id="hud-power">Power-Up: None</div>
                </div>
                <div class="hud-right">
                    <button id="pause-btn" class="mini-btn">Pause</button>
                </div>
            </div>

            <div id="boss-hud" class="hidden">
                <div id="boss-label" class="boss-label">Golden Sea Guardian</div>
                <div id="boss-hp-text" class="boss-hp-text">Boss HP: 20 / 20</div>
                <div class="boss-bar-wrap">
                    <div id="boss-bar"></div>
                </div>
            </div>

            <!-- MENU SCREEN -->
            <div id="menu-screen" class="screen">
                <div class="panel hero">
                    <div class="eyebrow">Premium 3-Level Ocean Combat Game</div>
                    <h1>Golden Tide: Ocean Blitz</h1>
                    <p class="lead">
                        Clear Level 1 and Level 2 to unlock the new third premium level. 
                    </p>

                    <div class="boat-grid">
                        <button id="boat-standard" class="boat-card selected">Level 1</button>
                        <button id="boat-golden" class="boat-card locked" disabled>Level 2</button>
                        <button id="boat-third" class="boat-card locked" disabled>Level 3</button>
                    </div>

                    <div class="menu-actions">
                        <!-- AD TRIGGER ATTACHED HERE -->
                        <button id="start-btn" class="primary-btn" onclick="showOceanAd()">Start Mission</button>
                        <button id="sound-btn" class="secondary-btn">Sound: On</button>
                    </div>
                </div>
            </div>

            <!-- PAUSE SCREEN -->
            <div id="pause-screen" class="screen hidden">
                <div class="panel small">
                    <div class="stack-actions">
                        <button id="pause-resume" class="primary-btn">Resume</button>
                        <button id="pause-restart" class="secondary-btn">Restart Run</button>
                        <button id="pause-menu" class="secondary-btn">Return To Menu</button>
                    </div>
                </div>
            </div>

            <!-- END SCREEN -->
            <div id="end-screen" class="screen hidden">
                <div class="panel small">
                    <h2 id="end-title">Victory</h2>
                    <div class="stack-actions">
                        <!-- AD TRIGGER ATTACHED HERE FOR RETRY -->
                        <button id="end-restart" class="primary-btn" onclick="showOceanAd()">Play Again</button>
                        <button id="end-menu" class="secondary-btn">Back To Menu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div id="desktop-controls" class="hidden">
            <button id="btn-fire-desktop" class="fire-btn desktop-fire">FIRE</button>
        </div>

        <div id="mobile-controls" class="hidden">
            <div class="mobile-left-stack">
                <button id="mob-up" class="mobile-ctrl">▲</button>
                <button id="mob-down" class="mobile-ctrl">▼</button>
            </div>
            <div class="mobile-right-stack">
                <button id="btn-fire-mobile" class="fire-btn mobile-fire">FIRE</button>
                <div class="mobile-turn-row">
                    <button id="mob-left" class="mobile-ctrl">◀</button>
                    <button id="mob-right" class="mobile-ctrl">▶</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
